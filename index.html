<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הודעות מוכנות - עלה עלה</title>
<style>
  :root {
    --leaf-dark: #2f5233;
    --leaf-mid: #4c7a3f;
    --leaf-light: #8fbc6a;
    --cream: #f7f5ee;
    --paper: #ffffff;
    --ink: #26301f;
    --ink-soft: #5c6650;
    --line: #dfe6d3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Segoe UI', 'Rubik', Arial, sans-serif;
    min-height: 100vh;
    padding: 32px 16px 64px;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  header .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--leaf-dark);
    color: #fff;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 26px;
    margin: 0 0 6px;
    color: var(--leaf-dark);
  }

  header p {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 22px;
    position: relative;
    box-shadow: 0 2px 8px rgba(47, 82, 51, 0.06);
    transition: box-shadow 0.2s ease;
  }

  .card-half-under-mail {
    width: calc(50% - 7px);
  }

  .card:hover {
    box-shadow: 0 4px 14px rgba(47, 82, 51, 0.1);
  }

  .compact-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 22px;
  }

  .card-compact {
    flex: none;
    width: calc(50% - 7px);
    min-width: 0;
    margin-bottom: 0;
    padding: 12px 13px;
    font-size: 0.85em;
  }

  .card-compact .card-title {
    font-size: 13px;
  }

  .card-compact .msg-box {
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.5;
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
  }

  .btn-stack {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }

  .telegram-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    color: var(--leaf-dark);
    border: 1.5px solid var(--leaf-mid);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }

  .telegram-btn:hover { background: #eef4e8; }
  .telegram-btn:active { transform: scale(0.97); }
  .telegram-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  #msg3 {
    flex: 0 1 300px;
  }

  #msg2 {
    flex: 1 1 0;
    min-width: 0;
  }

  .yuval-row {
    display: flex;
    gap: 14px;
    align-items: stretch;
  }

  .yuval-textarea {
    flex: 1;
    min-width: 0;
    height: 163px;
    resize: vertical;
    box-sizing: border-box;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    background: #fbfaf6;
  }

  .yuval-textarea:focus {
    outline: 2px solid var(--leaf-light);
    outline-offset: 1px;
  }

  .stack-spacer {
    grid-area: spacer;
  }

  .mini-btns {
    grid-area: buttons;
    display: flex;
    flex-direction: column;
    gap: 6px;
    justify-content: center;
    flex-shrink: 0;
  }

  .mini-btn {
    background: var(--leaf-light);
    color: var(--leaf-dark);
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .mini-btn:hover { background: #7aab5c; }
  .mini-btn:active { transform: scale(0.96); }

  .card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 15px;
    color: var(--leaf-dark);
  }

  .card-title .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--leaf-light);
    flex-shrink: 0;
  }

  .msg-box {
    white-space: pre-wrap;
    background: #fbfaf6;
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink);
  }

  .msg-box .hint {
    color: var(--leaf-mid);
    font-weight: 600;
  }

  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--leaf-mid);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }

  .copy-btn:hover { background: var(--leaf-dark); }
  .copy-btn:active { transform: scale(0.97); }

  .copy-btn.copied { background: #3a6b3f; }

  .copy-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  .extra-input {
    flex: 0 0 180px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .extra-input label {
    font-size: 12.5px;
    color: var(--ink-soft);
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .msg2-reset-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 4px 0;
    border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
    display: block;
    margin-right: auto;
  }

  .msg2-reset-btn:hover {
    background: #eef4e8;
    color: var(--leaf-dark);
  }

  .msg2-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 22px;
  }

  .msg2-row .card-compact {
    flex: none;
    width: calc(50% - 7px);
  }

  .msg2-extra-line {
    display: block;
    min-height: 1.4em;
  }

  .extra-input textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #fbfaf6;
  }

  .extra-input textarea:focus {
    outline: 2px solid var(--leaf-light);
    outline-offset: 1px;
  }

  .cert-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .cert-title {
    font-weight: 700;
    color: var(--leaf-dark);
    margin-bottom: 4px;
  }

  .cert-line,
  .cert-products-row {
    min-height: 1.7em;
  }

  .cert-line[contenteditable]:focus,
  .cert-line-inline[contenteditable]:focus {
    outline: none;
    background: #eef4e8;
    border-radius: 4px;
  }

  .cert-line:empty:before,
  .cert-line-inline:empty:before {
    content: attr(data-placeholder);
    color: #b3bba5;
    pointer-events: none;
  }

  .cert-products-row {
    font-weight: 400;
  }

  .cert-bullet {
    color: var(--leaf-mid);
    font-weight: 700;
  }

  .input-stack {
    flex: 1 1 auto;
    width: 100%;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: 1fr 1fr;
    grid-template-areas:
      "buttons late"
      "spacer  comp";
    gap: 8px 10px;
  }

  .visually-hidden-text {
    position: absolute;
    left: -9999px;
    top: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }

  .input-stack > *:nth-child(1) {
    grid-area: buttons;
  }

  .input-stack > *:nth-child(2) {
    grid-area: late;
  }

  .input-stack > *:nth-child(3) {
    grid-area: spacer;
  }

  .input-stack > *:nth-child(4) {
    grid-area: comp;
  }

  .input-stack .extra-input textarea {
    min-height: 130px;
  }

  @media (max-width: 700px) {
    .extra-input { flex: 0 0 auto; }
  }

  @media (max-width: 520px) {
    .compact-row .card-compact,
    .msg2-row .card-compact,
    .card-half-under-mail {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="compact-row">
    <div class="card card-compact">
      <div class="card-header">
        <div class="card-title"><span class="dot"></span> עדכון תעודת בוקר</div>
        <div class="btn-stack">
          <button class="telegram-btn" onclick="sendToTelegram('msg0', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
            שליחה להלן
          </button>
        </div>
      </div>
      <div class="msg-box cert-box" id="msg0">
        <div class="cert-title">*עדכון תעודת בוקר*</div>
        <div class="cert-line" id="cert-customer-name" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(שם לקוח)"></div>
        <div class="cert-line" id="cert-customer-number" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(מספר לקוח)"></div>
        <div class="cert-line" id="cert-driver-name" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(שם נהג)"></div>
        <div class="cert-products-row"><span class="cert-bullet">•</span> <span class="cert-line cert-line-inline" id="cert-products" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(פרטי המוצרים המעודכנים)"></span></div>
      </div>
      <button type="button" class="msg2-reset-btn" onclick="resetMorningCert()" title="איפוס">✕ איפוס</button>
    </div>

    <div class="card card-compact">
      <div class="card-header">
        <div class="card-title"><span class="dot"></span> עדכון תעודת לילה</div>
        <div class="btn-stack">
          <button class="telegram-btn" onclick="sendToTelegram('msg0-night', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
            שליחה להלן
          </button>
        </div>
      </div>
      <div class="msg-box cert-box" id="msg0-night">
        <div class="cert-title">*עדכון תעודת לילה*</div>
        <div class="cert-line" id="cert-night-customer-name" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(שם לקוח)"></div>
        <div class="cert-line" id="cert-night-customer-number" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(מספר לקוח)"></div>
        <div class="cert-line" id="cert-night-driver-name" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(שם נהג)"></div>
        <div class="cert-products-row"><span class="cert-bullet">•</span> <span class="cert-line cert-line-inline" id="cert-night-products" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(פרטי המוצרים המעודכנים)"></span></div>
      </div>
      <button type="button" class="msg2-reset-btn" onclick="resetNightCert()" title="איפוס">✕ איפוס</button>
    </div>
  </div>

  <div class="msg2-row">
    <div class="card card-compact">
      <div class="card-header">
        <div class="card-title"><span class="dot"></span> מייל</div>
        <button class="copy-btn" data-target="msg2" onclick="copyMsg(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          העתק
        </button>
      </div>
      <div class="msg-box" id="msg2">היי,<br><div class="cert-line msg2-extra-line" id="msg2-extra" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(הוספת טקסט)"></div><br>יש להשיב לכתובת המייל <span class="hint">orders@aleh-aleh.com</span><br><br>תודה,<br>פקידת הזמנות עלה עלה</div>
      <button type="button" class="msg2-reset-btn" onclick="resetMsg2Extra()" title="איפוס">✕ איפוס</button>
    </div>

    <div class="card card-compact">
      <div class="card-header">
        <div class="card-title"><span class="dot"></span> התייעצות</div>
        <button class="telegram-btn" onclick="sendYuvalToTelegram(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
          שליחה להלן
        </button>
      </div>
      <div class="yuval-row">
        <textarea spellcheck="true" lang="he" id="yuval-message" class="yuval-textarea" placeholder="כתבי כאן את תוכן ההתייעצות..."></textarea>
      </div>
      <button type="button" class="msg2-reset-btn" onclick="resetYuval()" title="איפוס">✕ איפוס</button>
    </div>
  </div>

  <div class="card card-half-under-mail">
    <div class="card-header">
      <div class="card-title"><span class="dot"></span> מאחרים והשלמות</div>
      <div class="btn-stack">
        <button class="copy-btn" data-target="msg3" onclick="copyMsg(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          העתק
        </button>
        <button class="telegram-btn" onclick="sendToTelegram('msg3', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
          שליחה להלן
        </button>
      </div>
    </div>
    <div class="input-stack">
      <div class="mini-btns">
        <button type="button" class="mini-btn" onclick="insertMarina('מרינה 0')">מרינה 0</button>
        <button type="button" class="mini-btn" onclick="insertMarina('מרינה')">מרינה</button>
        <button type="button" class="mini-btn" onclick="insertMarina('מרינה 2')">מרינה 2</button>
      </div>
      <div class="extra-input">
        <label for="latecomers-input">מאחרים</label>
        <textarea spellcheck="true" lang="he" id="latecomers-input" oninput="updateMsg3()" placeholder="שם לקוח&#10;שם לקוח"></textarea>
        <button type="button" class="msg2-reset-btn" onclick="resetLatecomersOnly()" title="איפוס">✕ איפוס</button>
      </div>
      <div class="mini-btns">
        <button type="button" class="mini-btn" onclick="insertMarina('מרינה 0', 'completions-input')">מרינה 0</button>
        <button type="button" class="mini-btn" onclick="insertMarina('מרינה', 'completions-input')">מרינה</button>
        <button type="button" class="mini-btn" onclick="insertMarina('מרינה 2', 'completions-input')">מרינה 2</button>
      </div>
      <div class="extra-input">
        <label for="completions-input">השלמות</label>
        <textarea spellcheck="true" lang="he" id="completions-input" oninput="updateMsg3()" placeholder="שם לקוח&#10;שם לקוח"></textarea>
        <button type="button" class="msg2-reset-btn" onclick="resetCompletionsOnly()" title="איפוס">✕ איפוס</button>
      </div>
    </div>
    <div class="msg-box visually-hidden-text" id="msg3" aria-hidden="true">*מאחרים*

*השלמות*</div>
  </div>
</div>

<script>
function copyMsg(btn) {
  const targetId = btn.getAttribute('data-target');
  const el = document.getElementById(targetId);
  const text = el.innerText;

  const finish = () => {
    const original = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = '✓ הועתק';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = original;
    }, 1600);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(finish).catch(() => fallbackCopy(text, finish));
  } else {
    fallbackCopy(text, finish);
  }
}

function updateMsg3() {
  const late = document.getElementById('latecomers-input').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  const comp = document.getElementById('completions-input').value
    .split('\n').map(s => s.trim()).filter(Boolean);

  const el = document.getElementById('msg3');
  const lateText = late.length ? late.join('\n') : '';
  const compText = comp.length ? comp.join('\n') : '';

  el.textContent = `*מאחרים*\n${lateText}\n\n*השלמות*\n${compText}`;
}

function insertMarina(label, targetId = 'latecomers-input') {
  const ta = document.getElementById(targetId);
  const text = `   *${label}*`;
  const start = ta.selectionStart ?? ta.value.length;
  const end = ta.selectionEnd ?? ta.value.length;

  ta.value = ta.value.slice(0, start) + text + ta.value.slice(end);

  const newPos = start + text.length;
  ta.focus();
  ta.setSelectionRange(newPos, newPos);

  updateMsg3();
}

async function sendYuvalToTelegram(btn) {
  const text = document.getElementById('yuval-message').value;
  const botToken = '8990030740:AAH7qav3xjdTzuhSiweTi-837tzA9BOMaIQ';
  const chatId = '6544075886';
  const original = btn.innerHTML;

  try {
    const res = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, text })
    });
    const data = await res.json();

    if (data.ok) {
      btn.innerHTML = '✓ נשלח';
      resetYuval();
    } else {
      console.error('Telegram error:', data);
      btn.innerHTML = '⚠ שגיאה בשליחה';
    }
  } catch (err) {
    console.error('Telegram send failed:', err);
    btn.innerHTML = '⚠ שגיאה בשליחה';
  }

  setTimeout(() => { btn.innerHTML = original; }, 2200);
}

async function sendToTelegram(msgId, btn) {
  const el = document.getElementById(msgId);
  const text = el.tagName === 'TEXTAREA' ? el.value : el.innerText;
  const botToken = '8990030740:AAH7qav3xjdTzuhSiweTi-837tzA9BOMaIQ';
  const chatId = '6544075886';
  const original = btn.innerHTML;

  try {
    const res = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, text })
    });
    const data = await res.json();

    if (data.ok) {
      btn.innerHTML = '✓ נשלח';
      if (msgId === 'msg0') resetMorningCert();
      else if (msgId === 'msg0-night') resetNightCert();
      else if (msgId === 'msg3') resetLatecomers();
    } else {
      console.error('Telegram error:', data);
      btn.innerHTML = '⚠ שגיאה בשליחה';
    }
  } catch (err) {
    console.error('Telegram send failed:', err);
    btn.innerHTML = '⚠ שגיאה בשליחה';
  }

  setTimeout(() => { btn.innerHTML = original; }, 2200);
}

function autosaveKey(id) { return 'alehaleh:' + id; }

function autosaveText(id, value) {
  try { localStorage.setItem(autosaveKey(id), value); } catch (e) {}
}

function clearAutosave(ids) {
  ids.forEach((id) => {
    try { localStorage.removeItem(autosaveKey(id)); } catch (e) {}
  });
}

function loadAutosave() {
  ['cert-customer-name', 'cert-customer-number', 'cert-driver-name', 'cert-products',
   'cert-night-customer-name', 'cert-night-customer-number', 'cert-night-driver-name', 'cert-night-products',
   'msg2-extra'
  ].forEach((id) => {
    let saved;
    try { saved = localStorage.getItem(autosaveKey(id)); } catch (e) { saved = null; }
    if (saved) document.getElementById(id).innerHTML = saved;
  });

  ['latecomers-input', 'completions-input', 'yuval-message'].forEach((id) => {
    let saved;
    try { saved = localStorage.getItem(autosaveKey(id)); } catch (e) { saved = null; }
    if (saved) document.getElementById(id).value = saved;
  });

  updateMsg3();
}

function resetMorningCert() {
  const ids = ['cert-customer-name', 'cert-customer-number', 'cert-driver-name', 'cert-products'];
  ids.forEach((id) => { document.getElementById(id).innerHTML = ''; });
  clearAutosave(ids);
}

function resetNightCert() {
  const ids = ['cert-night-customer-name', 'cert-night-customer-number', 'cert-night-driver-name', 'cert-night-products'];
  ids.forEach((id) => { document.getElementById(id).innerHTML = ''; });
  clearAutosave(ids);
}

function certPlaceCaret(el, atStart) {
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(atStart);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function certTextBeforeCaret(el) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return '';
  const range = sel.getRangeAt(0);
  const pre = document.createRange();
  pre.selectNodeContents(el);
  pre.setEnd(range.startContainer, range.startOffset);
  return pre.toString();
}

function certTextAfterCaret(el) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return '';
  const range = sel.getRangeAt(0);
  const post = document.createRange();
  post.selectNodeContents(el);
  post.setStart(range.endContainer, range.endOffset);
  return post.toString();
}

function certCaretAtFirstLine(el) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return true;
  const range = sel.getRangeAt(0).cloneRange();
  const rect = range.getClientRects()[0] || range.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  return Math.abs(rect.top - elRect.top) < 4;
}

function certCaretAtLastLine(el) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return true;
  const range = sel.getRangeAt(0).cloneRange();
  const rect = range.getClientRects()[0] || range.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();
  return Math.abs(rect.bottom - elRect.bottom) < 4;
}

function setupCertGroup(fieldIds) {
  const productsId = fieldIds[fieldIds.length - 1];

  fieldIds.forEach((id, idx) => {
    const el = document.getElementById(id);
    const isProducts = id === productsId;

    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (isProducts) {
          e.preventDefault();
          document.execCommand('insertHTML', false, '<br><span class="cert-bullet">•</span> ');
        } else {
          e.preventDefault();
          const nextId = fieldIds[idx + 1];
          if (nextId) certPlaceCaret(document.getElementById(nextId), true);
          else el.blur();
        }
        return;
      }

      if (e.key === 'ArrowDown') {
        const atLastLine = isProducts ? certCaretAtLastLine(el) : true;
        const nextId = fieldIds[idx + 1];
        if (atLastLine && nextId) {
          e.preventDefault();
          certPlaceCaret(document.getElementById(nextId), true);
        }
        return;
      }

      if (e.key === 'ArrowUp') {
        const atFirstLine = isProducts ? certCaretAtFirstLine(el) : true;
        const prevId = fieldIds[idx - 1];
        if (atFirstLine && prevId) {
          e.preventDefault();
          certPlaceCaret(document.getElementById(prevId), false);
        }
        return;
      }

      if (e.key === 'ArrowLeft') {
        const nextId = fieldIds[idx + 1];
        if (nextId && certTextAfterCaret(el).length === 0) {
          e.preventDefault();
          certPlaceCaret(document.getElementById(nextId), true);
        }
        return;
      }

      if (e.key === 'ArrowRight') {
        const prevId = fieldIds[idx - 1];
        if (prevId && certTextBeforeCaret(el).length === 0) {
          e.preventDefault();
          certPlaceCaret(document.getElementById(prevId), false);
        }
        return;
      }
    });
  });
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  cb();
}
