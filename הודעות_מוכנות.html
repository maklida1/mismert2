<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הודעות מוכנות - עלה עלה</title>
<style>
  :root {
    --leaf-dark: #2f5233;
    --leaf-mid: #4c7a3f;
    --leaf-light: #8fbc6a;
    --cream: #f7f5ee;
    --paper: #ffffff;
    --ink: #26301f;
    --ink-soft: #5c6650;
    --line: #dfe6d3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Segoe UI', 'Rubik', Arial, sans-serif;
    min-height: 100vh;
    padding: 32px 16px 64px;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  header .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--leaf-dark);
    color: #fff;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 26px;
    margin: 0 0 6px;
    color: var(--leaf-dark);
  }

  header p {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 22px;
    position: relative;
    box-shadow: 0 2px 8px rgba(47, 82, 51, 0.06);
    transition: box-shadow 0.2s ease;
  }

  .card-half-under-mail {
    width: calc(50% - 7px);
  }

  .card:hover {
    box-shadow: 0 4px 14px rgba(47, 82, 51, 0.1);
  }

  .compact-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 22px;
  }

  .card-compact {
    flex: none;
    width: calc(50% - 7px);
    min-width: 0;
    margin-bottom: 0;
    padding: 12px 13px;
    font-size: 0.85em;
  }

  .card-compact .card-title {
    font-size: 13px;
  }

  .card-compact .msg-box {
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.5;
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
  }

  .btn-stack {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }

  .telegram-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    color: var(--leaf-dark);
    border: 1.5px solid var(--leaf-mid);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }

  .telegram-btn:hover { background: #eef4e8; }
  .telegram-btn:active { transform: scale(0.97); }
  .telegram-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  #msg3 {
    flex: 0 1 300px;
  }

  #msg2 {
    flex: 1 1 0;
    min-width: 0;
  }

  .yuval-row {
    display: flex;
    gap: 14px;
    align-items: stretch;
  }

  .yuval-textarea {
    flex: 1;
    min-width: 0;
    height: 163px;
    resize: vertical;
    box-sizing: border-box;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    background: #fbfaf6;
  }

  .yuval-textarea:focus {
    outline: 2px solid var(--leaf-light);
    outline-offset: 1px;
  }

  .stack-spacer {
    grid-area: spacer;
  }

  .mini-btns {
    grid-area: buttons;
    display: flex;
    flex-direction: column;
    gap: 6px;
    justify-content: center;
    flex-shrink: 0;
  }

  .mini-btn {
    background: var(--leaf-light);
    color: var(--leaf-dark);
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .mini-btn:hover { background: #7aab5c; }
  .mini-btn:active { transform: scale(0.96); }

  .card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 15px;
    color: var(--leaf-dark);
  }

  .card-title .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--leaf-light);
    flex-shrink: 0;
  }

  .msg-box {
    white-space: pre-wrap;
    background: #fbfaf6;
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink);
  }

  .msg-box .hint {
    color: var(--leaf-mid);
    font-weight: 600;
  }

  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--leaf-mid);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }

  .copy-btn:hover { background: var(--leaf-dark); }
  .copy-btn:active { transform: scale(0.97); }

  .copy-btn.copied { background: #3a6b3f; }

  .copy-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  .extra-input {
    flex: 0 0 180px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .extra-input label {
    font-size: 12.5px;
    color: var(--ink-soft);
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .msg2-reset-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 4px 0;
    border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
    display: block;
    margin-right: auto;
  }

  .msg2-reset-btn:hover {
    background: #eef4e8;
    color: var(--leaf-dark);
  }

  .msg2-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 22px;
  }

  .msg2-row .card-compact {
    flex: none;
    width: calc(50% - 7px);
  }

  .msg2-extra-line {
    display: block;
    min-height: 1.4em;
  }

  .extra-input textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #fbfaf6;
  }

  .extra-input textarea:focus {
    outline: 2px solid var(--leaf-light);
    outline-offset: 1px;
  }

  .cert-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .cert-title {
    font-weight: 700;
    color: var(--leaf-dark);
    margin-bottom: 4px;
  }

  .cert-line,
  .cert-products-row {
    min-height: 1.7em;
  }

  .cert-line[contenteditable]:focus,
  .cert-line-inline[contenteditable]:focus {
    outline: none;
    background: #eef4e8;
    border-radius: 4px;
  }

  .cert-line:empty:before,
  .cert-line-inline:empty:before {
    content: attr(data-placeholder);
    color: #b3bba5;
    pointer-events: none;
  }

  .cert-products-row {
    font-weight: 400;
  }

  .cert-bullet {
    color: var(--leaf-mid);
    font-weight: 700;
  }

  .input-stack {
    flex: 1 1 auto;
    width: 100%;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: 1fr 1fr;
    grid-template-areas:
      "buttons late"
      "spacer  comp";
    gap: 8px 10px;
  }

  .visually-hidden-text {
    position: absolute;
    left: -9999px;
    top: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }

  .input-stack > *:nth-child(1) {
    grid-area: buttons;
  }

  .input-stack > *:nth-child(2) {
    grid-area: late;
  }

  .input-stack > *:nth-child(3) {
    grid-area: spacer;
  }

  .input-stack > *:nth-child(4) {
    grid-area: comp;
  }

  .input-stack .extra-input textarea {
    min-height: 130px;
  }

  @media (max-width: 700px) {
    .extra-input { flex: 0 0 auto; }
  }

  @media (max-width: 520px) {
    .compact-row .card-compact,
    .msg2-row .card-compact,
    .card-half-under-mail {
      width: 100%;
    }
  }
  .name-suggest-box {
    position: absolute;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(47, 82, 51, 0.15);
    z-index: 50;
    max-height: 160px;
    overflow-y: auto;
    display: none;
  }

  .name-suggest-item {
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink);
  }

  .name-suggest-item:hover,
  .name-suggest-item.active {
    background: #eef4e8;
  }
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<div class="name-suggest-box" id="name-suggest-box"></div>
<div class="wrap">
  <div class="compact-row">
    <div class="card card-compact">
      <div class="card-header">
        <div class="card-title"><span class="dot"></span> עדכון תעודת בוקר</div>
        <div class="btn-stack">
          <button class="telegram-btn" onclick="sendToTelegram('msg0', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
            שליחה להלן
          </button>
        </div>
      </div>
      <div class="msg-box cert-box" id="msg0">

        <div class="cert-line" id="cert-customer-name" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(שם לקוח)"></div>
        <div class="cert-line" id="cert-customer-number" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(מספר לקוח)"></div>
        <div class="cert-line" id="cert-driver-name" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(שם נהג)"></div>
        <div class="cert-products-row"><span class="cert-bullet">•</span> <span class="cert-line cert-line-inline" id="cert-products" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(פרטי המוצרים המעודכנים)"></span></div>

      <button type="button" class="msg2-reset-btn" onclick="resetMorningCert()" title="איפוס">✕ איפוס</button>

    <div class="card card-compact">
      <div class="card-header">
        <div class="card-title"><span class="dot"></span> עדכון תעודת לילה</div>
        <div class="btn-stack">
          <button class="telegram-btn" onclick="sendToTelegram('msg0-night', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
            שליחה להלן
          </button>
        </div>
      </div>
      <div class="msg-box cert-box" id="msg0-night">
        <div class="cert-title">*עדכון תעודת לילה*</div>
        <div class="cert-line" id="cert-night-customer-name" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(שם לקוח)"></div>
        <div class="cert-line" id="cert-night-customer-number" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(מספר לקוח)"></div>
        <div class="cert-line" id="cert-night-driver-name" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(שם נהג)"></div>
        <div class="cert-products-row"><span class="cert-bullet">•</span> <span class="cert-line cert-line-inline" id="cert-night-products" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(פרטי המוצרים המעודכנים)"></span></div>
      </div>
      <button type="button" class="msg2-reset-btn" onclick="resetNightCert()" title="איפוס">✕ איפוס</button>
    </div>
  </div>

  <div class="msg2-row">
    <div class="card card-compact">
      <div class="card-header">
        <div class="card-title"><span class="dot"></span> מייל</div>
        <button class="copy-btn" data-target="msg2" onclick="copyMsg(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          העתק
        </button>
      </div>
      <div class="msg-box" id="msg2">היי,<br><div class="cert-line msg2-extra-line" id="msg2-extra" contenteditable="true" spellcheck="true" lang="he" data-placeholder="(הוספת טקסט)"></div><br>יש להשיב לכתובת המייל <span class="hint">orders@aleh-aleh.com</span><br><br>תודה,<br>פקידת הזמנות עלה עלה</div>
      <button type="button" class="msg2-reset-btn" onclick="resetMsg2Extra()" title="איפוס">✕ איפוס</button>
    </div>

    <div class="card card-compact">

      <div class="btn-stack">

          העתק
        </button>
        <button class="telegram-btn" onclick="sendToTelegram('msg3', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>

      </div>

*השלמות*</div>

<script>
function copyMsg(btn) {
  const targetId = btn.getAttribute('data-target');
  const el = document.getElementById(targetId);
  const text = el.innerText;

  const finish = () => {
    const original = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = '✓ הועתק';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = original;
    }, 1600);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(finish).catch(() => fallbackCopy(text, finish));
  } else {
    fallbackCopy(text, finish);
  }
}

function updateMsg3() {
  const late = document.getElementById('latecomers-input').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  const comp = document.getElementById('completions-input').value
    .split('\n').map(s => s.trim()).filter(Boolean);

  const el = document.getElementById('msg3');
  const lateText = late.length ? late.join('\n') : '';
  const compText = comp.length ? comp.join('\n') : '';

  el.textContent = `*מאחרים*\n${lateText}\n\n*השלמות*\n${compText}`;
}

function insertMarina(label, targetId = 'latecomers-input') {
  const ta = document.getElementById(targetId);
  const text = `   *${label}*`;
  const start = ta.selectionStart ?? ta.value.length;
  const end = ta.selectionEnd ?? ta.value.length;

  ta.value = ta.value.slice(0, start) + text + ta.value.slice(end);

  const newPos = start + text.length;
  ta.focus();
  ta.setSelectionRange(newPos, newPos);

  updateMsg3();
}

function sendQuestionToTelegram(userName, questionText) {
  const scriptUrl = "https://script.google.com/macros/s/AKfycbzHrXYUmOTSaSA2ljxT6_-5ESIxdJxI83EgB1A8ezBVwArDnXEHEgpPuIWt-NNqIHASCA/exec";
  return fetch(scriptUrl, {
    method: "POST",
    mode: "no-cors", // <--- התוספת הקטנה שעושה את כל ההבדל!
    headers: {
      "Content-Type": "text/plain;charset=utf-8", // מונע בעיות CORS בשרת של גוגל
    },
    body: JSON.stringify({
      userName: userName,
      question: questionText
    })
  });
}

async function sendYuvalToTelegram(btn) {
  const text = document.getElementById('yuval-message').value;
  const original = btn.innerHTML;

  try {
    await sendQuestionToTelegram('התייעצות', text);
    btn.innerHTML = '✓ נשלח';
    resetYuval();
  } catch (err) {
    console.error('שגיאה בשליחה:', err);
    btn.innerHTML = '⚠ שגיאה בשליחה';
  }

  setTimeout(() => { btn.innerHTML = original; }, 2200);
}

async function sendToTelegram(msgId, btn) {
  const el = document.getElementById(msgId);
  const text = el.tagName === 'TEXTAREA' ? el.value : el.innerText;
  const original = btn.innerHTML;
  const labels = {
    msg0: 'עדכון תעודת בוקר',
    'msg0-night': 'עדכון תעודת לילה',
    msg3: 'מאחרים והשלמות'
  };
  const userName = labels[msgId] || 'עלה עלה';

  try {
    await sendQuestionToTelegram(userName, text);
    btn.innerHTML = '✓ נשלח';
    if (msgId === 'msg0') resetMorningCert();
    else if (msgId === 'msg0-night') resetNightCert();
    else if (msgId === 'msg3') resetLatecomers();
  } catch (err) {
    console.error('שגיאה בשליחה:', err);
    btn.innerHTML = '⚠ שגיאה בשליחה';
  }

  setTimeout(() => { btn.innerHTML = original; }, 2200);
}

function autosaveKey(id) { return 'alehaleh:' + id; }

function autosaveText(id, value) {
  try { localStorage.setItem(autosaveKey(id), value); } catch (e) {}
}

function clearAutosave(ids) {
  ids.forEach((id) => {
    try { localStorage.removeItem(autosaveKey(id)); } catch (e) {}
  });
}

function loadAutosave() {
  ['cert-customer-name', 'cert-customer-number', 'cert-driver-name', 'cert-products',
   'cert-night-customer-name', 'cert-night-customer-number', 'cert-night-driver-name', 'cert-night-products',
   'msg2-extra'
  ].forEach((id) => {
    let saved;

function certPlaceCaret(el, atStart) {
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(atStart);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function certTextBeforeCaret(el) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return '';
  const range = sel.getRangeAt(0);
  const pre = document.createRange();
  pre.selectNodeContents(el);
  pre.setEnd(range.startContainer, range.startOffset);
  return pre.toString();
}

function certTextAfterCaret(el) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return '';
  const range = sel.getRangeAt(0);
  const post = document.createRange();
  post.selectNodeContents(el);
  post.setStart(range.endContainer, range.endOffset);
  return post.toString();
}

function certBrCountBeforeCaret(el) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return 0;
  const range = sel.getRangeAt(0);
  const pre = document.createRange();
  pre.selectNodeContents(el);
  pre.setEnd(range.startContainer, range.startOffset);
  const frag = pre.cloneContents();
  return frag.querySelectorAll('br').length;
}

function certBrCountAfterCaret(el) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return 0;
  const range = sel.getRangeAt(0);
  const post = document.createRange();
  post.selectNodeContents(el);
  post.setStart(range.endContainer, range.endOffset);
  const frag = post.cloneContents();
  return frag.querySelectorAll('br').length;
}

function certCaretAtFirstLine(el) {
  return certBrCountBeforeCaret(el) === 0;
}

function certCaretAtLastLine(el) {
  return certBrCountAfterCaret(el) === 0;
}

function setupCertGroup(fieldIds) {
  const productsId = fieldIds[fieldIds.length - 1];

  fieldIds.forEach((id, idx) => {
    const el = document.getElementById(id);
    const isProducts = id === productsId;

    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (isProducts) {
          e.preventDefault();
          document.execCommand('insertHTML', false, '<br><span class="cert-bullet">•</span> ');
        } else {
          e.preventDefault();
          const nextId = fieldIds[idx + 1];
          if (nextId) certPlaceCaret(document.getElementById(nextId), true);
          else el.blur();
        }
        return;
      }

      if (e.key === 'ArrowDown') {
        const atLastLine = isProducts ? certCaretAtLastLine(el) : true;
        const nextId = fieldIds[idx + 1];
        if (atLastLine && nextId) {
          e.preventDefault();
          certPlaceCaret(document.getElementById(nextId), true);
        }
        return;
      }

      if (e.key === 'ArrowUp') {
        const atFirstLine = isProducts ? certCaretAtFirstLine(el) : true;
        const prevId = fieldIds[idx - 1];
        if (atFirstLine && prevId) {
          e.preventDefault();
          certPlaceCaret(document.getElementById(prevId), false);
        }
        return;
      }

      if (e.key === 'ArrowLeft') {
        const nextId = fieldIds[idx + 1];
        if (nextId && certTextAfterCaret(el).length === 0) {
          e.preventDefault();
          certPlaceCaret(document.getElementById(nextId), true);
        }
        return;
      }

      if (e.key === 'ArrowRight') {
        const prevId = fieldIds[idx - 1];
        if (prevId && certTextBeforeCaret(el).length === 0) {
          e.preventDefault();
          certPlaceCaret(document.getElementById(prevId), false);
        }
        return;
      }
    });
  });
}

let knownNamesCache = [];
let namesDb = null;

try {
  firebase.initializeApp(firebaseConfig);
  namesDb = firebase.database();
  namesDb.ref('knownNames').on('value', (snapshot) => {
    const val = snapshot.val() || {};
    knownNamesCache = Object.values(val);
  });
} catch (e) {
  console.error('Firebase init failed, autocomplete will be local-only this session:', e);
}

function saveKnownName(name) {
  const clean = (name || '').trim();
  if (!clean || !namesDb) return;
  const key = clean.toLowerCase().replace(/[.#$\[\]/]/g, '_');
  namesDb.ref('knownNames/' + key).set(clean).catch((e) => console.error('שגיאה בשמירת שם:', e));
}

const suggestBox = document.getElementById('name-suggest-box');
let suggestActiveEl = null;
let suggestActiveIndex = -1;

function hideSuggestions() {
  suggestBox.style.display = 'none';
  suggestBox.innerHTML = '';
  suggestActiveEl = null;
  suggestActiveIndex = -1;
}

function getCurrentQuery(el, mode) {
  if (mode === 'single') {
    return (el.tagName === 'DIV' ? el.innerText : el.value).trim();
  }
  const val = el.value;
  const pos = el.selectionStart ?? val.length;
  const lineStart = val.lastIndexOf('\n', pos - 1) + 1;
  return val.slice(lineStart, pos).trim();
}

function replaceCurrentLine(el, newText) {
  const val = el.value;
  const pos = el.selectionStart ?? val.length;
  const lineStart = val.lastIndexOf('\n', pos - 1) + 1;
  let lineEnd = val.indexOf('\n', pos);
  if (lineEnd === -1) lineEnd = val.length;
  el.value = val.slice(0, lineStart) + newText + val.slice(lineEnd);
  const newPos = lineStart + newText.length;
  el.focus();
  el.setSelectionRange(newPos, newPos);
}

function applySuggestion(el, mode, name) {
  if (mode === 'single') {
    if (el.tagName === 'DIV') {
      el.innerText = name;
    } else {
      el.value = name;
    }
  } else {
    replaceCurrentLine(el, name);
  }
  el.dispatchEvent(new Event('input', { bubbles: true }));
  hideSuggestions();
  el.focus();
}

function showSuggestions(el, mode) {
  const query = getCurrentQuery(el, mode);
  if (!query) { hideSuggestions(); return; }
  const matches = knownNamesCache
    .filter((n) => n.toLowerCase().startsWith(query.toLowerCase()) && n.toLowerCase() !== query.toLowerCase())
    .slice(0, 6);
  if (!matches.length) { hideSuggestions(); return; }

  suggestBox.innerHTML = '';
  matches.forEach((name) => {
    const item = document.createElement('div');
    item.className = 'name-suggest-item';
    item.textContent = name;
    item.addEventListener('mousedown', (e) => {
      e.preventDefault();
      applySuggestion(el, mode, name);
    });
    suggestBox.appendChild(item);
  });

  const rect = el.getBoundingClientRect();
  suggestBox.style.left = (window.scrollX + rect.left) + 'px';
  suggestBox.style.top = (window.scrollY + rect.bottom + 4) + 'px';
  suggestBox.style.width = Math.max(rect.width, 140) + 'px';
  suggestBox.style.display = 'block';

  suggestActiveEl = el;
  suggestActiveIndex = -1;
}

function attachAutocomplete(el, mode) {
  el.addEventListener('input', () => showSuggestions(el, mode));

  el.addEventListener('keydown', (e) => {
    if (suggestBox.style.display !== 'block' || suggestActiveEl !== el) return;
    const items = Array.from(suggestBox.querySelectorAll('.name-suggest-item'));
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      suggestActiveIndex = Math.min(suggestActiveIndex + 1, items.length - 1);
      items.forEach((it, i) => it.classList.toggle('active', i === suggestActiveIndex));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      suggestActiveIndex = Math.max(suggestActiveIndex - 1, 0);
      items.forEach((it, i) => it.classList.toggle('active', i === suggestActiveIndex));
    } else if (e.key === 'Enter' || e.key === 'Tab') {
      if (suggestActiveIndex >= 0 && items[suggestActiveIndex]) {
        e.preventDefault();
        applySuggestion(el, mode, items[suggestActiveIndex].textContent);
      }
    } else if (e.key === 'Escape') {
      hideSuggestions();
    }
  });

  el.addEventListener('blur', () => {
    setTimeout(hideSuggestions, 150);
    if (mode === 'single') {
      const text = (el.tagName === 'DIV' ? el.innerText : el.value).trim();
      if (text) saveKnownName(text);
    } else {
      el.value.split('\n').forEach((line) => {
        const clean = line.replace(/\*/g, '').trim();
        if (clean) saveKnownName(clean);
      });
    }
  });
}

function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  cb();
}
